[package]
name = "textbooklens"
version = "0.1.0"
description = "Local-first AI textbook reader"
authors = ["TextbookLens contributors"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.94"

[lib]
name = "textbooklens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait = "=0.1.91"
chrono = { version = "=0.4.45", features = ["serde"] }
eventsource-stream = "=0.2.3"
futures-util = "=0.3.33"
keyring = "=4.1.6"
parking_lot = "=0.12.5"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream", "multipart", "gzip", "brotli"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-deserialize", "macros", "migrate", "uuid", "chrono", "json"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "=0.7.19"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "=12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
uuid = { version = "=1.24.0", features = ["v4", "v5", "serde"] }
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
keyring-core = "=1.0.0"
windows-native-keyring-store = "=1.1.0"

[dev-dependencies]
insta = { version = "=1.48.0", features = ["json"] }
proptest = "=1.11.0"
tempfile = "=3.27.0"
wiremock = "=0.6.5"
