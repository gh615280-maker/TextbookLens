name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows-installers:
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -j 1 -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features -j 1
      - run: npm run check:dependencies
      - run: npm run check:licenses
      - run: npm run check:sensitive
      - run: npm run check:generated
      - run: npm run fixtures:verify
      - run: npm run tauri build
      - name: Collect standard installers
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\release\bundle'
          $assetRoot = Join-Path $env:RUNNER_TEMP "textbooklens-release"
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null
          $exe = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'nsis') -File -Filter '*.exe')
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'msi') -File -Filter '*.msi')
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) { throw "Expected exactly one standard EXE and one standard MSI installer." }
          Copy-Item -LiteralPath $exe[0].FullName -Destination $assetRoot
          Copy-Item -LiteralPath $msi[0].FullName -Destination $assetRoot
      - name: Build complete offline installers
        run: npm run tauri -- bundle --config src-tauri/tauri.offline.conf.json
      - name: Audit and collect offline release assets
        shell: pwsh
        run: |
          $repoRoot = $env:GITHUB_WORKSPACE
          $bundleRoot = Join-Path $repoRoot 'src-tauri\target\release\bundle'
          $assetRoot = Join-Path $env:RUNNER_TEMP "textbooklens-release"
          node scripts/audit-release-artifacts.mjs --no-defaults --root $bundleRoot --root (Join-Path $repoRoot 'src-tauri\resources') --root (Join-Path $repoRoot 'src-tauri\migrations') --file (Join-Path $repoRoot 'LICENSES.md') --file (Join-Path $repoRoot 'THIRD_PARTY_NOTICES.md')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'nsis') -File -Filter '*.exe')
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'msi') -File -Filter '*.msi')
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) { throw "Expected exactly one offline EXE and one offline MSI installer." }
          $offlineExeName = $exe[0].Name -replace '-setup\.exe$', '-offline-setup.exe'
          $offlineMsiName = $msi[0].Name -replace '\.msi$', '-offline.msi'
          if ($offlineExeName -eq $exe[0].Name -or $offlineMsiName -eq $msi[0].Name) { throw "Unable to derive distinct offline installer names." }
          Copy-Item -LiteralPath $exe[0].FullName -Destination (Join-Path $assetRoot $offlineExeName)
          Copy-Item -LiteralPath $msi[0].FullName -Destination (Join-Path $assetRoot $offlineMsiName)
          $installers = @(Get-ChildItem -LiteralPath $assetRoot -File | Where-Object Extension -in '.exe', '.msi')
          if ($installers.Count -ne 4) { throw "Expected exactly four release installers." }
          $checksumLines = Get-ChildItem -LiteralPath $assetRoot -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          Set-Content -LiteralPath (Join-Path $assetRoot "SHA256SUMS.txt") -Value $checksumLines -Encoding utf8NoBOM
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetRoot = Join-Path $env:RUNNER_TEMP "textbooklens-release"
          $assets = Get-ChildItem -LiteralPath $assetRoot -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --title "TextbookLens $env:GITHUB_REF_NAME"
